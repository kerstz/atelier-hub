[server]
port = 7777
# upload max (Mo) et espace disque libre à garder (Go) sur le dossier de données
max_upload_mb = 16384
min_free_gb = 2

[paths]
output = "~/Atelier"
data = "~/.local/share/atelier"

[gpu]
# "auto" = AMD card with most VRAM; or "card1"
card = "auto"
# décharger les modèles Ollama avant un job GPU qui n'en a pas besoin (whisper, upscale, demucs)
free_vram = true

[ollama]
url = "http://127.0.0.1:11434"
translate_model = "translategemma:12b"
second_model = "gemma3:12b"
# secondes sans réponse d'Ollama avant abandon (chargement du modèle compris)
timeout = 300
# modèle vision pour Traduire > image
vision_model = "gemma3:12b"

[translate]
chunk_chars = 2500
# envoyer le bloc précédent (source + traduction) en contexte: termes et registre cohérents
context = true
# auto | ollama | ctranslate2 (NLLB sur CPU, pour les petites machines). auto ne choisit que parmi
# ce qui est déjà installé; les modèles "auto" ci-dessous suivent la recommandation du matériel.
engine = "auto"

[ctranslate2]
# modèle NLLB-200 converti CTranslate2 int8 (voir install.sh --engine=ct2), licence CC-BY-NC
model_dir = "~/.local/share/atelier/nllb-200-distilled-600M-int8"
# 0 = tous les cœurs
threads = 0

[youtube]
sub_langs = "en"
# ex: "firefox" pour vidéos protégées
cookies_from_browser = ""
# ex: "5M"
rate_limit = ""

[whisper]
bin = "whisper-cli"
model = "~/.local/opt/whisper.cpp/models/ggml-large-v3-turbo.bin"
threads = 8

[subtitles]
# cues par lot envoyé au LLM
batch = 40
num_ctx = 8192
# sous-titres auto YouTube (qualité < whisper) : non
use_auto_captions = false

[docs]
# vide = ollama.translate_model
pdf_model = ""
qps = 2
# extraction auto de glossaire par pdf2zh (appels LLM en plus)
auto_glossary = false
# OCR auto des PDF sans texte (uv tool install ocrmypdf ; tesseract-data-fra/eng)
ocr_bin = "ocrmypdf"
ocr_langs = "fra+eng"
ocr_jobs = 4

[summary]
# vide = ollama.second_model
model = ""
# contexte du modèle : les transcripts longs sont découpés (map-reduce) pour tenir dedans
num_ctx = 8192
lang = "fr"

[convert]
# encodage matériel h264/hevc (RDNA2: pas d'encodage AV1 matériel → libsvtav1 CPU)
vaapi_device = "/dev/dri/renderD128"
# conversions simultanées (hors file GPU)
jobs = 2

[tts]
# uv tool install piper-tts ; voix: python -m piper.download_voices <voix> --download-dir <voices_dir>
bin = "piper"
voices_dir = "~/.local/share/piper"
# langue -> voix (défauts: fr/en/de/es/it ; ajouter sous [tts.voices])
[tts.voices]
fr = "fr_FR-siwis-medium"

[images]
# zip GitHub Real-ESRGAN ncnn-vulkan (ex: realesrgan_bin = "~/.local/opt/realesrgan/realesrgan-ncnn-vulkan") ; models_dir vide = dossier models à côté du binaire
realesrgan_bin = "~/.local/opt/realesrgan/realesrgan-ncnn-vulkan"
models_dir = ""
gpu_id = 0
# uv tool install "rembg[cpu,cli]"
rembg_bin = "rembg"
rembg_model = "u2net"

[audio]
# uv tool install demucs ; device: auto | cpu | cuda (ROCm torch = cuda)
demucs_bin = "demucs"
demucs_device = "auto"
# binaire deep-filter (DeepFilterNet releases) ou "deepFilter" (uv tool install deepfilternet)
deepfilter_bin = "deep-filter"

[desktop]
# notification bureau (notify-send) à la fin d'une tâche
notify = true
# jobs plus courts que ça: pas de notification (les échecs notifient toujours)
notify_min_seconds = 5

# Services externes : sonde de port + démarrage/arrêt (jamais d'installation).
# unit = unité systemd --user ; dir = dossier docker compose (+ file optionnel).
# Sans unit ni dir : sonde + lien seulement.
[services.openwebui]
name = "Open WebUI"
port = 3000

[services.pinchflat]
name = "Pinchflat"
port = 8945

[services.jellyfin]
name = "Jellyfin"
port = 8096

[services.immich]
name = "Immich"
port = 2283

[services.stirling]
name = "Stirling-PDF"
port = 8080

[voice]
# auto | seedvc | dsp. seedvc = Seed-VC zéro-shot (GPU, scripts/voice-setup.sh); dsp = effets ffmpeg seuls
engine = "auto"
python = "~/.local/share/atelier/seedvc-venv/bin/python"
seedvc_dir = "~/.local/opt/seed-vc"
voices_dir = "~/.local/share/atelier/voices"
# direct: bloc (s, plus petit = moins de latence mais plus de charge), étapes de diffusion, cfg (0 = plus rapide)
live_block = 0.18
live_steps = 6
live_cfg = 0.0
live_gate_db = -50
live_max_minutes = 120
# fichiers: étapes de diffusion (plus = plus propre, plus lent)
file_steps = 30
# poids déjà en cache: aucun accès réseau pendant l'usage
offline = true

[player]
# lecteur intégré: auto = lit tel quel si le format est sûr pour la vue, sinon prépare un mp4 H.264/AAC (mis en cache)
# transcode = auto | always | never
transcode = "auto"
cache_days = 7
cache_max_gb = 5
# fenêtre native: décodage logiciel (évite le chemin VA/GL de GStreamer). ATELIER_WEBKIT_SAFE=0 pour l'enlever.
safe_gst = true
mpv_bin = "mpv"
