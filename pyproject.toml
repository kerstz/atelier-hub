[project]
name = "atelier"
version = "0.1.3"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.143",
    "uvicorn>=0.30",
    "httpx>=0.27",
    "python-docx>=1.2.0",
    "python-pptx>=1.0.2",
    "openpyxl>=3.1.5",
    "lxml>=5.0",
]

[dependency-groups]
# fenêtre native: installée par scripts/install-desktop.sh dans un venv à part
# (python système + --system-site-packages: PyGObject/WebKitGTK ou PyQt6 viennent de pacman)
desktop = ["pywebview>=5.3", "qtpy>=2.4"]

[tool.uv]
package = false
